name: Auto Update Berita Mahasiswa Selangor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest local student news
        run: python server.py --fetch-once

      - name: Commit and push updated news cache
        run: |
          if git diff --quiet -- js/live-news-cache.json; then
            echo "Tiada perubahan berita baharu."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add js/live-news-cache.json
            git commit -m "chore: auto-update berita mahasiswa Selangor [skip ci]"
            git push
          fi
