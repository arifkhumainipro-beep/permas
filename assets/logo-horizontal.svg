<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="hzGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#E5A914" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="hzRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>
  
  <!-- Emblem on left -->
  <g transform="translate(10, 10) scale(0.16)">
    <circle cx="250" cy="250" r="230" fill="none" stroke="url(#hzGold)" stroke-width="12" />
    <circle cx="250" cy="250" r="205" fill="#0F172A" />
    <!-- Shield -->
    <path d="M 250,110 C 315,110 335,140 335,210 C 335,285 275,325 250,345 C 225,325 165,285 165,210 C 165,140 185,110 250,110 Z"
          fill="#1E293B" stroke="url(#hzGold)" stroke-width="10" />
    <!-- Yellow and Red quarters -->
    <rect x="175" y="125" width="75" height="90" fill="url(#hzRed)" />
    <rect x="250" y="125" width="75" height="90" fill="url(#hzGold)" />
    <rect x="175" y="215" width="75" height="95" fill="url(#hzGold)" />
    <rect x="250" y="215" width="75" height="95" fill="url(#hzRed)" />
    <!-- Torch Flame -->
    <path d="M 250,160 C 255,175 265,185 262,195 C 258,205 242,205 238,195 C 235,185 245,175 250,160 Z" fill="#FFE066" />
  </g>

  <!-- Typography -->
  <text x="105" y="44" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="3">
    PERMAS
  </text>
  <text x="240" y="44" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="url(#hzGold)" letter-spacing="3">
    NASIONAL
  </text>
  <text x="107" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1.8">
    PERSATUAN MAHASISWA SELANGOR
  </text>
  <rect x="107" y="76" width="280" height="2" fill="url(#hzGold)" rx="1" />
</svg>

