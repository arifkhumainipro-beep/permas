<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#E5A914" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.8" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Outer Dark Shield Base -->
  <circle cx="250" cy="250" r="205" fill="url(#shieldGrad)" />

  <!-- Circular Text Path -->
  <path id="textCircleTop" d="M 75,250 A 175,175 0 0,1 425,250" fill="none" />
  <path id="textCircleBottom" d="M 425,250 A 175,175 0 0,1 75,250" fill="none" />

  <text font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="url(#goldGrad)" letter-spacing="4.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      PERSATUAN MAHASISWA SELANGOR
    </textPath>
  </text>

  <text font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#F8FAFC" letter-spacing="6">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      ★ NASIONAL MALAYSIA ★
    </textPath>
  </text>

  <!-- Inner Crest Shield -->
  <g transform="translate(0, -10)">
    <!-- Shield Outline & Background -->
    <path d="M 250,110 C 315,110 335,140 335,210 C 335,285 275,325 250,345 C 225,325 165,285 165,210 C 165,140 185,110 250,110 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="6" />

    <!-- Shield Dual Color (Selangor Red & Gold) -->
    <clipPath id="shieldClip">
      <path d="M 250,110 C 315,110 335,140 335,210 C 335,285 275,325 250,345 C 225,325 165,285 165,210 C 165,140 185,110 250,110 Z" />
    </clipPath>

    <g clip-path="url(#shieldClip)">
      <!-- Top Left Red -->
      <rect x="150" y="100" width="100" height="120" fill="url(#redGrad)" />
      <!-- Top Right Yellow -->
      <rect x="250" y="100" width="100" height="120" fill="url(#goldGrad)" />
      <!-- Bottom Left Yellow -->
      <rect x="150" y="220" width="100" height="130" fill="url(#goldGrad)" />
      <!-- Bottom Right Red -->
      <rect x="250" y="220" width="100" height="130" fill="url(#redGrad)" />

      <!-- Crescent & Star Motif (Selangor Royal Element) -->
      <path d="M 248,135 A 25,25 0 0,0 220,165 A 25,25 0 0,0 248,195 A 20,20 0 0,1 236,165 A 20,20 0 0,1 248,135 Z" fill="#FFFFFF" />
      <polygon points="262,150 265,157 273,157 266,162 269,170 262,165 255,170 258,162 251,157 259,157" fill="#FFFFFF" />
    </g>

    <!-- Torch of Knowledge (Obor) -->
    <g transform="translate(0, 30)">
      <!-- Book Base -->
      <path d="M 210,250 C 230,242 245,248 250,252 C 255,248 270,242 290,250 C 290,265 270,260 250,265 C 230,260 210,265 210,250 Z" 
            fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
      <path d="M 215,257 C 235,250 245,255 250,259 C 255,255 265,250 285,257" 
            fill="none" stroke="#0F172A" stroke-width="1.5" />

      <!-- Flame -->
      <path d="M 250,195 C 255,210 265,220 262,230 C 258,240 242,240 238,230 C 235,220 245,210 250,195 Z" 
            fill="url(#goldGrad)" filter="url(#glow)" />
      <path d="M 250,205 C 253,215 258,222 256,228 C 253,234 247,234 244,228 C 242,222 247,215 250,205 Z" 
            fill="#FFFFFF" />
    </g>
  </g>

  <!-- 9 District Stars (Representing 9 Districts of Selangor) -->
  <g fill="url(#goldGrad)">
    <circle cx="100" cy="250" r="4" />
    <circle cx="108" cy="205" r="4" />
    <circle cx="125" cy="165" r="4" />
    <circle cx="155" cy="130" r="4" />
    <circle cx="250" cy="85" r="6" />
    <circle cx="345" cy="130" r="4" />
    <circle cx="375" cy="165" r="4" />
    <circle cx="392" cy="205" r="4" />
    <circle cx="400" cy="250" r="4" />
  </g>

  <!-- Bottom Ribbon with Motto -->
  <g transform="translate(0, 15)">
    <!-- Ribbon Wings -->
    <polygon points="120,400 150,380 150,420" fill="#991B1B" />
    <polygon points="380,400 350,380 350,420" fill="#991B1B" />
    <!-- Ribbon Center -->
    <path d="M 140,380 L 360,380 L 345,420 L 155,420 Z" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Text on Ribbon -->
    <text x="250" y="407" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      BERBAKTI • BERWIBAWA • PROGRESIF
    </text>
  </g>
</svg>

